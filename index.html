<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>釜山 Color Walk</title>
    <!-- 1. 載入 Tailwind CSS 與 Lucide 圖示所需的 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 2. 載入 React 與 Babel (讓瀏覽器能直接解析 JSX) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 3. 載入 Firebase (使用相容版本以利在 HTML 中運行) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }
        .animate-wave-slow { animation: wave 8s ease-in-out infinite; }
        .animate-wave-fast { animation: wave 5s ease-in-out infinite; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- Firebase 初始化 (請確保 __firebase_config 已在全域或手動替換) ---
        // 如果報錯，請將下方 JSON.parse 部分替換成你的 Firebase Config 物件
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { /* 這裡填入你的 Firebase Config */ };
            
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'busan-color-walk-001';

        const { useState, useEffect, useRef } = React;

        // --- Lucide 圖示組件 ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                const icon = lucide.createIcons.icons[name];
                if (icon) {
                    const svgString = lucide.createElement(icon).outerHTML;
                    setSvg(svgString);
                }
            }, [name]);
            return <span className={className} dangerouslySetInnerHTML={{ __html: svg }} style={{ display: 'inline-flex', width: size, height: size }} />;
        };

        const Seagull = ({ className }) => (
            <svg viewBox="0 0 100 50" className={className}>
                <path d="M10,30 Q30,10 50,30 Q70,10 90,30" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round" />
            </svg>
        );

        const SailboatBeach = () => (
            <svg viewBox="0 0 240 200" className="w-40 h-32 md:w-48 md:h-40 drop-shadow-xl">
                <path d="M10,170 Q120,140 230,170 L230,200 L10,200 Z" fill="#FDE68A" />
                <circle cx="40" cy="180" r="2" fill="#F59E0B" opacity="0.5" />
                <path d="M10,165 Q120,135 230,165" fill="none" stroke="#BAE6FD" strokeWidth="3" strokeDasharray="10,5" opacity="0.6" />
                <g className="animate-bounce" style={{ animationDuration: '3s' }}>
                    <path d="M70,140 L170,140 L155,160 L85,160 Z" fill="#1E3A8A" stroke="#1E293B" strokeWidth="2" />
                    <rect x="117" y="70" width="4" height="70" fill="#475569" />
                    <path d="M123,75 L165,130 L123,130 Z" fill="white" stroke="#1E3A8A" strokeWidth="1.5" />
                    <path d="M121,70 L135,75 L121,80" fill="#EF4444" />
                </g>
            </svg>
        );

        const BASE_COLORS = [
            { id: 'black', name: '黑色', hex: '#1A1A1B', text: 'white' },
            { id: 'red', name: '紅色', hex: '#E74C3C', text: 'white' },
            { id: 'orange', name: '橙色', hex: '#E67E22', text: 'white' },
            { id: 'yellow', name: '黃色', hex: '#F1C40F', text: 'black' },
            { id: 'white', name: '白色', hex: '#FDFEFE', text: 'black' },
            { id: 'blue', name: '藍色', hex: '#3498DB', text: 'white' },
            { id: 'green', name: '綠色', hex: '#27AE60', text: 'white' },
            { id: 'purple', name: '紫色', hex: '#8E44AD', text: 'white' }
        ];

        const ALL_OPTIONS = [];
        ['A', 'B'].forEach(group => {
            BASE_COLORS.forEach(c => {
                ALL_OPTIONS.push({ ...c, group, key: `${c.id}-${group}` });
            });
        });

        function App() {
            const [user, setUser] = useState(null);
            const [userName, setUserName] = useState('');
            const [picks, setPicks] = useState([]);
            const [isSpinning, setIsSpinning] = useState(false);
            const [result, setResult] = useState(null);
            const [loading, setLoading] = useState(true);
            const canvasRef = useRef(null);
            const startAngle = useRef(0);
            const spinRequestRef = useRef(null);

            useEffect(() => {
                auth.signInAnonymously().catch(console.error);
                return auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubscribe = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('picks')
                    .onSnapshot((snapshot) => {
                        setPicks(snapshot.docs.map(doc => doc.data()));
                    });
                return () => unsubscribe();
            }, [user]);

            const drawWheel = (angleOffset = 0) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const outerRadius = Math.min(centerX, centerY) * 0.85;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ALL_OPTIONS.forEach((opt, i) => {
                    const isTaken = picks.some(p => p.key === opt.key);
                    const angleStep = (Math.PI * 2) / ALL_OPTIONS.length;
                    const start = angleOffset + i * angleStep;
                    const end = start + angleStep;

                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, outerRadius, start, end);
                    ctx.fillStyle = isTaken ? '#cbd5e1' : opt.hex;
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(start + angleStep / 2);
                    ctx.textAlign = "right";
                    ctx.fillStyle = isTaken ? '#64748b' : opt.text;
                    ctx.font = "bold 11px 'Noto Sans TC'";
                    ctx.fillText(isTaken ? "已佔" : `${opt.name[0]}${opt.group}`, outerRadius - 10, 4);
                    ctx.restore();
                });
            };

            useEffect(() => { drawWheel(startAngle.current); }, [picks]);

            const spin = () => {
                if (!userName.trim()) return alert("請輸入航海員姓名。");
                if (isSpinning) return;
                setIsSpinning(true);
                let spinTime = 0;
                const spinTimeTotal = 4000 + Math.random() * 2000;
                const initialVelocity = 0.5;
                const animate = () => {
                    spinTime += 20;
                    if (spinTime < spinTimeTotal) {
                        startAngle.current += initialVelocity * (1 - (spinTime / spinTimeTotal));
                        drawWheel(startAngle.current);
                        spinRequestRef.current = requestAnimationFrame(animate);
                    } else {
                        finishSpin();
                    }
                };
                animate();
            };

            const finishSpin = async () => {
                const totalOptions = ALL_OPTIONS.length;
                const anglePerOption = (Math.PI * 2) / totalOptions;
                const normalizedAngle = ( (Math.PI * 1.5) - startAngle.current ) % (Math.PI * 2);
                const positiveAngle = normalizedAngle < 0 ? normalizedAngle + Math.PI * 2 : normalizedAngle;
                const index = Math.floor(positiveAngle / anglePerOption) % totalOptions;
                const selected = ALL_OPTIONS[index];
                
                const pickData = { userName, color: selected.name, group: selected.group, hex: selected.hex, key: selected.key, timestamp: Date.now(), userId: user.uid };
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('picks').doc(selected.key).set(pickData);
                setResult(pickData);
                setIsSpinning(false);
            };

            if (loading) return <div className="flex h-screen items-center justify-center bg-blue-50 text-blue-600">載入中...</div>;

            return (
                <div className="min-h-screen bg-gradient-to-b from-[#0ea5e9] via-[#7dd3fc] to-[#fef3c7] p-4 flex flex-col items-center overflow-x-hidden pb-20 relative">
                    <Seagull className="absolute top-12 left-10 w-12 opacity-40" />
                    
                    <div className="w-full max-w-md flex flex-col items-center relative z-10 pt-4">
                        <SailboatBeach />
                        <div className="w-full bg-white/90 backdrop-blur-xl rounded-[3rem] p-8 shadow-2xl text-center">
                            <h1 className="text-4xl font-black text-blue-900 mb-8">釜山 Color Walk</h1>
                            
                            {!result ? (
                                <div className="space-y-5">
                                    <input 
                                        type="text" 
                                        placeholder="輸入航海員姓名..." 
                                        className="w-full px-6 py-4 rounded-[2rem] bg-blue-50 border-2 outline-none font-bold"
                                        value={userName}
                                        onChange={(e) => setUserName(e.target.value)}
                                    />
                                    <button 
                                        onClick={spin}
                                        disabled={isSpinning}
                                        className="w-full py-5 rounded-[2rem] font-black text-xl text-white bg-blue-600 shadow-xl"
                                    >
                                        {isSpinning ? '正在破浪前進...' : '出發尋找寶藏'}
                                    </button>
                                </div>
                            ) : (
                                <div className="py-4">
                                    <div className="text-5xl font-black mb-3" style={{ color: result.hex }}>{result.color}</div>
                                    <button onClick={() => setResult(null)} className="mt-4 px-8 py-2 bg-blue-950 text-white rounded-full">返回</button>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="relative my-12">
                        <canvas ref={canvasRef} width={400} height={400} className="max-w-[88vw] h-auto border-[12px] border-white rounded-full bg-white/30" />
                    </div>

                    <div className="w-full max-w-md bg-white/60 backdrop-blur-2xl rounded-[3rem] p-8 shadow-2xl">
                        <h3 className="text-blue-950 font-black text-xl mb-6">航海日誌</h3>
                        <div className="space-y-3 max-h-80 overflow-y-auto custom-scrollbar">
                            {picks.map(pick => (
                                <div key={pick.key} className="flex items-center gap-4 p-4 rounded-[2rem] bg-white shadow-sm">
                                    <div className="w-4 h-4 rounded-full" style={{ backgroundColor: pick.hex }} />
                                    <span className="font-bold flex-1">{pick.userName}</span>
                                    <span className="text-xs text-slate-400">{pick.color} · {pick.group}組</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
