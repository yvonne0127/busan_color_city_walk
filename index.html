<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>釜山 Color Walk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 改用單一相容版 SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // --- 請在這裡填入你的設定 ---
        const firebaseConfig = {
            apiKey: "你的真實API_KEY",
            authDomain: "你的真實DOMAIN",
            projectId: "你的真實ID",
            storageBucket: "你的真實BUCKET",
            messagingSenderId: "你的真實ID",
            appId: "你的真實APP_ID"
        };

        // 初始化與啟動
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        function App() {
            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-blue-400">
                    <h1 className="text-white text-4xl font-black">釜山 Color Walk 已連線！</h1>
                    <p className="text-white mt-4">如果你看到這行字，代表白屏已解決。</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
